global:
  environment: dev

backend:
  replicaCount: 1

frontend:
  replicaCount: 1

agent:
  replicaCount: 1
  env:
    marketDataProvider: finnhub

ingress:
  enabled: true
  className: ""
  host: ""

# Copy to a gitignored values-secrets.yaml and fill in, then:
#   helm upgrade --install pulse ./charts/ai-stock-pulse -f values-dev.yaml -f values-secrets.yaml
secrets:
  existingSecret: stock-pulse-secrets

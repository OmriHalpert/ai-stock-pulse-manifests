{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-stock-pulse.fullname" . }}-postgres
  labels:
    {{- include "ai-stock-pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "ai-stock-pulse.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}

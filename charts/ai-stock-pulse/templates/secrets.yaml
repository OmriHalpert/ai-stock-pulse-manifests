{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-stock-pulse.secretName" . }}
  labels:
    {{- include "ai-stock-pulse.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.postgres.credentials.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.credentials.dbName | b64enc | quote }}
  DATABASE_URL: {{ include "ai-stock-pulse.databaseUrl" . | b64enc | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secrets.telegramBotToken | default "" | b64enc | quote }}
  TELEGRAM_CHAT_ID: {{ .Values.secrets.telegramChatId | default "" | b64enc | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | default "" | b64enc | quote }}
  FINNHUB_API_KEY: {{ .Values.secrets.finnhubApiKey | default "" | b64enc | quote }}
{{- end }}

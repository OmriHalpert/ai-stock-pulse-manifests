apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "ai-stock-pulse.fullname" . }}-external-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-stock-pulse.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: stock-pulse-secretstore
    kind: SecretStore
  target:
    name: {{ include "ai-stock-pulse.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: POSTGRES_DB
    - secretKey: DATABASE_URL
      remoteRef:
        key: DATABASE_URL
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: TELEGRAM_CHAT_ID
    - secretKey: LLM_API_KEY
      remoteRef:
        key: LLM_API_KEY
    - secretKey: FINNHUB_API_KEY
      remoteRef:
        key: FINNHUB_API_KEY

{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ai-stock-pulse.fullname" . }}-backend
  labels:
    {{- include "ai-stock-pulse.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    # kube-prometheus-stack only scrapes ServiceMonitors with this release label by default
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
{{- end }}

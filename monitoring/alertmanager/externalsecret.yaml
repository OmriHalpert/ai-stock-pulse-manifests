# Builds Alertmanager config from the existing app secret (Telegram bot).
# ESO fills bot_token / chat_id; do not put those values in Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: monitoring-secretstore
    kind: SecretStore
  target:
    name: alertmanager-telegram-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: telegram
            group_by:
              - alertname
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - receiver: "null"
                matchers:
                  - alertname =~ "Watchdog|InfoInhibitor"
          receivers:
            - name: "null"
            - name: telegram
              telegram_configs:
                - send_resolved: true
                  bot_token: "{{ .TELEGRAM_BOT_TOKEN }}"
                  chat_id: {{ .TELEGRAM_CHAT_ID }}
                  parse_mode: HTML
  dataFrom:
    - extract:
        key: ai-stock-pulse-dev-app-secret

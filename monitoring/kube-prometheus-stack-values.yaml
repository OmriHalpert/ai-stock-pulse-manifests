grafana:
  persistence:
    enabled: false
  grafana.ini:
    server:
      root_url: https://grafana.ai-stuck-pulse.xyz
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      editable: true
  ingress:
    enabled: true
    ingressClassName: alb
    hosts:
      - grafana.ai-stuck-pulse.xyz
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:661985535801:certificate/87f1910a-5152-4d5f-be36-b3b58317533f
      alb.ingress.kubernetes.io/group.name: ai-stock-pulse

alertmanager:
  alertmanagerSpec:
    # Secret is created by ESO (monitoring/alertmanager). Key must be alertmanager.yaml.
    configSecret: alertmanager-telegram-config
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec: {}

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

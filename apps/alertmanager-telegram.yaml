apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alertmanager-telegram
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/OmriHalpert/ai-stock-pulse-manifests.git
    targetRevision: main
    path: monitoring/alertmanager
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
